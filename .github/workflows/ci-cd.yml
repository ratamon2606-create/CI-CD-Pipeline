name: CI and Docker Publish

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t ci-cd-pipeline:ci .

      - name: Container smoke test
        run: |
          docker run -d --name app-smoke \
            -p 127.0.0.1:3001:3000 \
            ci-cd-pipeline:ci

          trap 'docker rm -f app-smoke || true' EXIT

          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/health \
              | grep -Fq '{"status":"ok"}'; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 1
          done

          docker logs app-smoke
          exit 1

  publish:
    needs: test-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/ci-cd-pipeline:latest
            ${{ secrets.DOCKER_USERNAME }}/ci-cd-pipeline:${{ github.sha }}
